site_name: SBCB Tech Catch-ups
site_description: Searchable notes and resources from weekly software and computing catch-ups.
repo_url: https://github.com/KhalidLab/tech_catch_ups
repo_name: tech_catch_ups

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search
  - awesome-nav
  - tags:
      tags_allowed:
        # Programming and code
        - Algorithms
        - APIs
        - Code Quality
        - Compilers
        - Debugging
        - Git
        - Open Source
        - Performance
        - Programming Languages
        - Python
        - Reproducibility
        - Version Control
        # Software engineering and tooling
        - Architecture
        - Build Systems
        - CI/CD
        - Containers
        - Databases
        - DevOps
        - Documentation
        - Package Management
        - Security
        - Software Design
        - Software Engineering
        - Tooling
        # Testing
        - Benchmarking
        - Integration Testing
        - Property-Based Testing
        - Testing
        - Unit Testing
        # Computing and research computing
        - Cloud Computing
        - Distributed Computing
        - GPU Computing
        - High-Performance Computing
        - Linux
        - Networking
        - Parallel Computing
        - Research Computing
        - Scientific Computing
        - Systems
        # Machine learning
        - Computer Vision
        - Data Science
        - Deep Learning
        - Machine Learning
        - MLOps
        - Natural Language Processing
        - Neural Networks
        - Reinforcement Learning
        # AI and agents
        - AI
        - AI Agents
        - Agentic Workflows
        - Evaluation
        - Generative AI
        - Large Language Models
        - Prompt Engineering
        - Retrieval-Augmented Generation
        - Tool Use

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

# Manual nav section substituted by mkdocs-awesome-nav
# nav:
#   - Home: index.md
#   - Meetings:
#       - Overview: meetings/index.md
#       - 
#   - Tags: tags.md

exclude_docs: |
  meetings/TEMPLATE.md
